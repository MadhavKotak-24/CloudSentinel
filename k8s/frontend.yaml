apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsentinel-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudsentinel-frontend
  template:
    metadata:
      labels:
        app: cloudsentinel-frontend
    spec:
      containers:
      - name: frontend
        image: cloudsentinel-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: cloudsentinel-frontend
