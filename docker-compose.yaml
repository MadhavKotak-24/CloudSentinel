services:

  backend:

    build:
      context: ./backend

    container_name: cloudsentinel-backend

    ports:
      - "5000:5000"

    env_file:
      - .env

    volumes:
      - ./backend:/app

    depends_on:
      - db


  db:

    image: postgres:16

    container_name: cloudsentinel-db

    restart: always

    environment:

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

    postgres_data: